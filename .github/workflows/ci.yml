name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version: ["3.11"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test tools
        run: python -m pip install --upgrade pip

      - name: Install editable package and Ruff
        run: python -m pip install --editable . ruff

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify the portable CLI parser
        run: >-
          python -c "from codex_accounts.cli import parser; args = parser().parse_args(['select', 'account']); assert args.command == 'select' and args.subject == 'account'"

      - name: Check lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Build wheel
        run: python -m pip wheel --no-deps --no-cache-dir --wheel-dir dist .
