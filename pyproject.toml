[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "codex-accounts"
version = "0.2.0"
description = "Manual account selection for the official Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "IOANNIS SIOKOS" }]

[project.scripts]
codex-accounts = "codex_accounts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["codex_accounts"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
